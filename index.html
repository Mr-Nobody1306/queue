<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f6">
<link rel="stylesheet" href="action/style.css"> 
<title>RideQueue — Dispatch Queue App (C++)</title>
</head>
<body>

<div class="phoneFull">
  <div class="apptop">
    <h1>RideQueue<small id="countEl">5 / 8 • FIFO dispatch queue</small></h1>
    <button class="iconBtn" id="pdfBtn" title="Open explanation PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>Guide</button>
    <button class="iconBtn" id="cppBtn" title="Download ridequeue.cpp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>C++</button>
  </div>
  <div class="loadbar"><i id="loadFillEl"></i></div>
  <div class="board" id="boardCtn">
   <div class="pane paneLeft">
    <div class="nextCard">
      <small>Next up — front of queue</small>
      <b id="nextNameEl">Ama Serwaa</b>
      <div class="route"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span id="nextRouteEl">Airport → Osu</span></div>
      <div class="rowbtns" style="display:flex; gap:8px; margin-top:11px"><button class="btn btn-primary btn-sm" id="dispatchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Dispatch to driver</button></div>
    </div>
    <div class="secLabel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg><span class="lbl">On trip</span><span class="cnt" id="tripCntEl">0</span></div>
    <div id="tripsCtn"><div class="emptyNote">No active trips — dispatch the front rider.</div></div>
   </div>
   <div class="pane paneRight">
    <div class="secLabel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span class="lbl">Waiting line</span><button class="btn btn-primary btn-sm" id="reqBtn2" style="margin-left:auto">+ Request</button><span class="cnt" id="waitCntEl">5</span></div>
    <div class="qList" id="queueListCtn"></div>
   </div>
  </div>
  <div class="sheet" id="addSheetCtn" hidden>
    <h4>Request a ride — joins the rear</h4>
    <input id="nameInput" type="text" maxlength="28" placeholder="Rider name">
    <input id="pickupInput" type="text" maxlength="28" placeholder="Pickup e.g. Airport">
    <input id="dropoffInput" type="text" maxlength="28" placeholder="Dropoff e.g. Osu">
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
      <button class="btn btn-dark btn-sm" id="saveRideBtn">Request</button>
      <button class="btn btn-ghost btn-sm" id="cancelSheetBtn">Cancel</button>
      <span style="color:#64748b; font-size:12px" id="sheetMsgEl"></span>
    </div>
  </div>
  <div class="toast" id="toastEl"></div>
  <div class="tabbar">
    <button id="tabQueueBtn" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Queue</button>
    <button id="tabAddBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Request</button>
    <button id="tabDispatchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Dispatch</button>
  </div>
</div>

<script src="action/script.js" type="module">
</script>

</body>
</html>
